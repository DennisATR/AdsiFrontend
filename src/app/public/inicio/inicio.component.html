<div class="bienvenida-container">
  <div class="bienvenida-card">
    <svg class="bienvenida-icono" xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 -960 960 960" width="1em" fill="currentColor"><path d="M280-80v-360H120v-80l60-240h600l60 240v80H680v360H280Zm80-80h240v-280H360v280Zm-160-80h80v-200h-80v200Zm480 0h80v-200h-80v200ZM224-520h512l-40-160H264l-40 160Zm256 0Z"/></svg>
    <h2>Bienvenido al sistema ADSI</h2>
    <p>Gestión de ventas y administración</p>
  </div>
</div>

<!-- Modal Base de Caja -->
<div class="modal-overlay" *ngIf="mostrarModalBase">
  <div class="modal-card">
    <div class="modal-header">
      <svg class="modal-icon" xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 -960 960 960" width="1em" fill="currentColor"><path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v160h-80v-160H160v480h640v-160h80v160q0 33-23.5 56.5T800-160H160Zm0-80h640v-80H160v80Zm0-480v80-80Zm400 320q-33 0-56.5-23.5T480-480q0-33 23.5-56.5T560-560h320v160H560Zm160-40q17 0 28.5-11.5T760-480q0-17-11.5-28.5T720-520q-17 0-28.5 11.5T680-480q0 17 11.5 28.5T720-440Z"/></svg>
      <h5>Base de Caja del Día</h5>
      <p class="modal-subtitle">Ingrese el monto disponible en caja para comenzar el día</p>
    </div>
    <form [formGroup]="fGroup" class="modal-form">
      <div class="input-group">
        <label for="Base">Monto en caja (Base)</label>
        <div class="input-with-icon">
          <span class="currency-symbol">$</span>
          <input
            formControlName="Base"
            id="Base"
            type="number"
            min="0"
            step="10000"
            placeholder="0"
            class="modal-input"
          />
        </div>
        <div class="error-message" *ngIf="ObtenerFormGroup['Base'].invalid && ObtenerFormGroup['Base'].touched">
          <small>Ingrese un monto válido (mayor o igual a 0).</small>
        </div>
      </div>
      <div class="modal-actions">
        <button
          class="btn-registrar"
          type="button"
          (click)="RegistrarBase()"
          [disabled]="cargando">
          <svg class="btn-icon" style="vertical-align: middle; margin-right: 8px;" xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 -960 960 960" width="1em" fill="currentColor"><path d="M840-680v480q0 33-23.5 56.5T760-120H200q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h480l160 160Zm-80 34L646-760H200v560h560v-446ZM480-240q50 0 85-35t35-85q0-50-35-85t-85-35q-50 0-85 35t-35 85q0 50 35 85t85 35ZM240-560h360v-160H240v160Zm-40-86v446-560 114Z"/></svg>
          <span *ngIf="!cargando">Registrar Base</span>
          <span *ngIf="cargando">Guardando...</span>
        </button>
      </div>
    </form>
  </div>
</div>
