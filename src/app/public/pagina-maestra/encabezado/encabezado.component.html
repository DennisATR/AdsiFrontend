<nav class="blue">
  <div class="nav-wrapper">
    <!-- Incluir el componente del menú lateral aquí -->
    <app-menu-lateral *ngIf="sesionActiva"></app-menu-lateral>

    <a routerLink="/inicio" class="brand-logo left" style="margin-left: 2rem; font-weight: bold; ">
      ADSI
    </a>

    <!-- Botón de notificaciones: Solo visible si el usuario tiene sesión activa Y TIENE PERMISO para notificaciones -->
    <div *ngIf="sesionActiva && tienePermisoNotificaciones" class="notificacion-bell-container right">
      <button class="btn-bell" (click)="toggleDropdown()" title="Notificaciones de exhibición">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bell-icon"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6" /><path d="M9 17v1a3 3 0 0 0 6 0v-1" /></svg>
        <span *ngIf="notificaciones.length > 0" class="red-dot"></span>
      </button>
      <app-notificacion-dropdown
        *ngIf="mostrarDropdown"
        [notificaciones]="notificaciones"
        (cerrar)="mostrarDropdown = false">
      </app-notificacion-dropdown>
    </div>

    <ul class="right nav-items">
      <li><a *ngIf="!sesionActiva" routerLink="/seguridad/identificar-usuario">Inicio Sesión</a></li>
      <ng-container *ngIf="sesionActiva">
        <li *ngFor="let menu of menusNavegacion">
          <a [routerLink]="menu.ruta">{{ menu.texto }}</a>
        </li>
      </ng-container>
    </ul>
  </div>
</nav>
