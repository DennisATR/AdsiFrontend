<!-- Botón del menú lateral -->
<a href="#" data-target="slide-out" class="sidenav-trigger" style="margin-left: 10px; display: inline-block;">
  <i class="material-icons white-text">menu</i>
</a>

<!-- Contenido del menú lateral -->
<ul id="slide-out" class="sidenav">
  <li>
    <div class="user-view">
      <div class="background">
        <img src="https://materializecss.com/images/office.jpg" />
      </div>
      <a href="#user">
        <img class="circle" src="https://materializecss.com/images/yuna.jpg" />
      </a>
      <a href="#name">
        <span class="white-text name">{{nombreUsuario}}</span>
      </a>
    </div>
  </li>
  <div class="menu-dinamico" *ngIf="listaMenus && listaMenus.length">
    <li *ngFor="let menu of listaMenus">
      <a [routerLink]="menu.ruta"><i class="material-icons">arrow_right</i>{{ menu.texto }}</a>
    </li>
    <li class="divider"></li>
  </div>

  <!-- Enlaces fijos adicionales -->
  <li><a routerLink="/parametros/informacion"><i class="material-icons">info</i>Información del Local</a></li>
  <li><a routerLink="/ventas/cierre-caja"><i class="material-icons">account_balance</i>Cierre de Caja</a></li>
  <li><a routerLink="/seguridad/cambio-clave"><i class="material-icons">lock</i>Cambiar Clave</a></li>
  <li><a routerLink="/seguridad/cerrar-sesion"><i class="material-icons">exit_to_app</i>Cerrar Sesión</a></li>
</ul>
