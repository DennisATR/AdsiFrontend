<!-- Botón del menú lateral (hamburguesa) -->
<a href="#" data-target="slide-out" class="sidenav-trigger sidenav-toggle-btn">
  <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor">
    <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z" />
  </svg>
</a>

<!-- Contenido del menú lateral -->
<ul id="slide-out" class="sidenav snav">

  <!-- ── Brand / Nombre del Local ── -->
  <li class="snav-brand-li">
    <div class="snav-brand">
      <span class="snav-brand-name">{{ nombreLocal || 'Mi Local' }}</span>
    </div>
  </li>

  <!-- ── Perfil del Usuario ── -->
  <li class="snav-profile-li">
    <div class="snav-profile-card">
      <div class="snav-avatar">
        <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor">
          <path
            d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 128.5-46.5T480-440q67 0 133.5 15.5T742-378q29 15 46.5 43.5T806-272v112H160Z" />
        </svg>
      </div>
      <div class="snav-user-info">
        <span class="snav-username">{{ nombreUsuario }}</span>
        <span class="snav-role">{{ nombreRol }}</span>
      </div>
    </div>
  </li>

  <!-- ── Menú dinámico (solo móvil) ── -->
  <div class="menu-dinamico" *ngIf="modulosMovil && modulosMovil.length">
    <li class="snav-section-label">Módulos</li>
    <li *ngFor="let menu of modulosMovil">
      <a class="snav-link" [routerLink]="menu.ruta" (click)="cerrarMenu()">
        <span class="snav-link-icon" [innerHTML]="menu.safeIcono"></span>
        <span>{{ menu.texto }}</span>
      </a>
    </li>
  </div>

  <!-- ── Navegación principal ── -->
  <li class="snav-section-label" *ngIf="tienePermiso('11') || tienePermiso('14')">General</li>

  <li *ngIf="tienePermiso('11')">
    <a class="snav-link" routerLink="/parametros/informacion" (click)="cerrarMenu()">
      <svg class="snav-link-icon" xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20"
        fill="currentColor">
        <path
          d="M440-280h80v-240h-80v240Zm40-320q17 0 28.5-11.5T520-640q0-17-11.5-28.5T480-680q-17 0-28.5 11.5T440-640q0 17 11.5 28.5T480-600Zm0 520q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z" />
      </svg>
      <span>Información del Local</span>
    </a>
  </li>

  <li *ngIf="tienePermiso('14')">
    <a class="snav-link" routerLink="/ventas/cierre-caja" (click)="cerrarMenu()">
      <svg class="snav-link-icon" xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20"
        fill="currentColor">
        <path
          d="M80-120v-80h800v80H80Zm160-160v-320h80v320h-80Zm200 0v-320h80v320h-80Zm200 0v-320h80v320h-80ZM80-680v-80l400-200 400 200v80H80Zm146-80h508l-254-127-254 127Zm254-63Z" />
      </svg>
      <span>Cierre de Caja</span>
    </a>
  </li>

  <!-- ── Divider antes de Cerrar Sesión ── -->
  <li class="snav-footer-divider"></li>

  <li>
    <a class="snav-link snav-link-logout" routerLink="/seguridad/cerrar-sesion" (click)="cerrarMenu()">
      <svg class="snav-link-icon" xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20"
        fill="currentColor">
        <path
          d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h280v80H200Zm440-160-55-58 102-102H360v-80h327L585-622l55-58 200 200-200 200Z" />
      </svg>
      <span>Cerrar Sesión</span>
    </a>
  </li>

</ul>
