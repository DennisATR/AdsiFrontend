<div class="table-container">
  <div class="table-header">
    <h5>Lista de Proveedores</h5>
  </div>
  <div class="search-bar">
    <input type="text"
           placeholder="Buscar proveedor..."
           [(ngModel)]="searchQuery"
           (input)="filtrarProveedor()"
           class="validate" />
  </div>

  <table class="striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Empresa</th>
        <th>Teléfono</th>
        <th>Correo</th>
        <th>Ciudad</th>
        <th>NIT</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let proveedor of proveedoresFiltrados | paginate: { itemsPerPage: registrosPorPagina, currentPage: pag, totalItems: totalItems }">
        <td>{{ proveedor.id }}</td>
        <td>{{ proveedor.Nombre }}</td>
        <td>{{ proveedor.Empresa }}</td>
        <td>{{ proveedor.Telefono }}</td>
        <td>{{ proveedor.Correo }}</td>
        <td>{{ proveedor.Ciudad }}</td>
        <td>{{ proveedor.NIT }}</td>
        <td class="actions-cell">
          <div class="action-buttons">
            <a [routerLink]="['/parametros/proveedor/editar-proveedor', proveedor.id]" 
               class="btn-action btn-edit" 
               title="Editar proveedor">
              ✏️
            </a>
            <a [routerLink]="['/parametros/proveedor/eliminar-proveedor', proveedor.id]" 
               class="btn-action btn-delete" 
               title="Eliminar proveedor">
              ✕
            </a>
          </div>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Control de paginación -->
  <pagination-controls
    (pageChange)="pag = $event"
    previousLabel="Anterior"
    nextLabel="Siguiente"
    screenReaderPaginationLabel="Navegación"
    screenReaderPageLabel="Página"
    screenReaderCurrentLabel="Página Actual">
  </pagination-controls>
</div>
