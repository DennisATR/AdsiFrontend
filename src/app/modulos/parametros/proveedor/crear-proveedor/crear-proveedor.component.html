<div class="card-container">
    <div class="title">
      <h5>Gestión de Proveedores</h5>
    </div>
    <form [formGroup]="fGroup" class="col s12">
      <!-- Sección de Información del Proveedor -->
      <div class="form-section">
        <div class="row">
          <div class="input col s12 m4 l4">
            <input formControlName="Nombre"
                   id="Nombre"
                   #nombre
                   (keydown.enter)="focusNext(nombre, empresa)"
                   type="text"
                   class="validate" />
            <label for="Nombre">Nombre</label>
            <div *ngIf="ObtenerFormGroup['Nombre'].invalid && ObtenerFormGroup['Nombre'].touched" class="error-message">
              <small>El nombre es obligatorio.</small>
            </div>
          </div>

          <div class="input col s12 m4 l4">
            <input formControlName="Empresa"
                   id="Empresa"
                   #empresa
                   (keydown.enter)="focusNext(empresa, telefono)"
                   type="text"
                   class="validate" />
            <label for="Empresa">Empresa</label>
            <div *ngIf="ObtenerFormGroup['Empresa'].invalid && ObtenerFormGroup['Empresa'].touched" class="error-message">
              <small>La empresa es obligatoria.</small>
            </div>
          </div>

          <div class="input col s12 m4 l4">
            <input formControlName="Telefono"
                   id="Telefono"
                   #telefono
                   (keydown.enter)="focusNext(telefono, correo)"
                   type="text"
                   class="validate" />
            <label for="Telefono">Teléfono</label>
            <div *ngIf="ObtenerFormGroup['Telefono'].invalid && ObtenerFormGroup['Telefono'].touched" class="error-message">
              <small>El teléfono es obligatorio y debe tener entre 7 y 10 dígitos.</small>
            </div>
          </div>
        </div>
      </div>

      <!-- Sección de Contacto y Ubicación -->
      <div class="form-section">
        <div class="row">
          <div class="input col s12 m4 l4">
            <input formControlName="Correo"
                   id="Correo"
                   #correo
                   (keydown.enter)="focusNext(correo, ciudadSelect)"
                   type="email"
                   class="validate" />
            <label for="Correo">Correo Electrónico</label>
            <div *ngIf="ObtenerFormGroup['Correo'].invalid && ObtenerFormGroup['Correo'].touched" class="error-message">
              <small>El correo es obligatorio y debe ser válido.</small>
            </div>
          </div>

          <div class="input col s12 m4 l4">
          <input formControlName="Ciudad" appSearchSelect [opciones]="ciudadesComunes" [permitirPersonalizado]="true"
            placeholder="Escribe o selecciona una ciudad..." id="Ciudad" #ciudadSelect
            (keydown.enter)="focusNext(ciudadSelect, nit)" type="text" class="validate" />
          <label for="Ciudad">Ciudad</label>
          <div *ngIf="ObtenerFormGroup['Ciudad'].invalid && ObtenerFormGroup['Ciudad'].touched" class="error-message">
            <small>La ciudad es obligatoria.</small>
          </div>
        </div>

          <div class="input col s12 m4 l4">
            <input formControlName="NIT"
                   id="NIT"
                   #nit
                   (keydown.enter)="submitOrFocusNext(nit)"
                   type="text"
                   class="validate" />
            <label for="NIT">NIT</label>
            <div *ngIf="ObtenerFormGroup['NIT'].invalid && ObtenerFormGroup['NIT'].touched" class="error-message">
              <small>El NIT es obligatorio.</small>
            </div>
          </div>
        </div>
      </div>

      <div class="row button-row">
        <div class="col s12 button-container">
          <button class="btn-custom waves-effect waves-light"
                  type="button"
                  (click)="RegistrarProveedor()">
            Guardar
          </button>
        </div>
      </div>
    </form>

    <!-- Tabla de Proveedores -->
    <app-listar-proveedor></app-listar-proveedor>
</div>
