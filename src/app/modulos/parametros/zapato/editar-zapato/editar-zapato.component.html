<div class="container">
  <div class="card">
    <div class="card-header">
      <legend>Editar Zapato</legend>
    </div>

    <div class="card-content">
      <form [formGroup]="fgValidador" (ngSubmit)="ActualizarRegistro()">
        <div class="form-grid">
          <!-- Descripción -->
          <div class="input">
            <input type="text" id="descripcion" formControlName="descripcion" class="validate"
              [class.error]="descripcion?.invalid && descripcion?.touched">
            <label for="descripcion">Descripción</label>
            <div *ngIf="descripcion?.invalid && descripcion?.touched" class="error-message">
              <small *ngIf="descripcion?.errors?.['required']">La descripción es requerida</small>
            </div>
          </div>

          <!-- Categoría -->
          <div class="input">
            <input type="text" id="categoria" appSearchSelect [opciones]="categorias" [permitirPersonalizado]="true"
              formControlName="categoria" class="validate" [class.error]="categoria?.invalid && categoria?.touched">
            <label for="categoria">Categoría</label>
            <div *ngIf="categoria?.invalid && categoria?.touched" class="error-message">
              <small *ngIf="categoria?.errors?.['required']">La categoría es requerida</small>
            </div>
          </div>

        <div class="input">
            <input type="text" id="genero" appSearchSelect [opciones]="generos" [permitirPersonalizado]="true"
              formControlName="genero" class="validate" [class.error]="genero?.invalid && genero?.touched">
            <label for="genero">Público</label>
            <div *ngIf="genero?.invalid && genero?.touched" class="error-message">
              <small *ngIf="genero?.errors?.['required']">El público es requerido</small>
            </div>
        </div>
        

          <!-- Talla -->
          <div class="input">
            <input type="number" id="talla" formControlName="talla" class="validate"
              [class.error]="talla?.invalid && talla?.touched">
            <label for="talla">Talla</label>
            <div *ngIf="talla?.invalid && talla?.touched" class="error-message">
              <small *ngIf="talla?.errors?.['required']">La talla es requerida</small>
            </div>
          </div>

          <!-- Color -->
          <div class="input">
            <input type="text" id="color" appMultiSelect [opciones]="colores" placeholder="Selecciona colores..."
              formControlName="color" class="validate" [class.error]="color?.invalid && color?.touched">
            <label for="color">Color</label>
            <div *ngIf="color?.invalid && color?.touched" class="error-message">
              <small *ngIf="color?.errors?.['required']">El color es requerido</small>
            </div>
          </div>

          <!-- Referencia -->
          <div class="input">
            <input type="text" id="referencia" formControlName="referencia" class="validate"
              [class.error]="referencia?.invalid && referencia?.touched">
            <label for="referencia">Referencia</label>
            <div *ngIf="referencia?.invalid && referencia?.touched" class="error-message">
              <small *ngIf="referencia?.errors?.['required']">La referencia es requerida</small>
            </div>
          </div>

          <div class="input col s3">
            <input formControlName="proveedorNombre" appSearchSelect [opciones]="proveedoresNombres"
              [permitirPersonalizado]="false" (opcionSeleccionada)="onProveedorSeleccionado($event)"
              placeholder="Busca un proveedor..." id="proveedorNombre" #proveedor type="text" class="validate">
            <label for="proveedorNombre">Proveedor</label>
          </div>



          <!-- Precio Venta Máximo -->
          <div class="input">
            <input type="text" id="precioVentaMax" appFormatoMiles formControlName="precioVentaMax" class="validate"
              [class.error]="precioVentaMax?.invalid && precioVentaMax?.touched">
            <label for="precioVentaMax">Precio Venta Máximo</label>
            <div *ngIf="precioVentaMax?.invalid && precioVentaMax?.touched" class="error-message">
              <small *ngIf="precioVentaMax?.errors?.['required']">El precio máximo es requerido</small>
            </div>
          </div>

          <!-- Precio Venta Mínimo -->
          <div class="input">
            <input type="text" id="precioVentaMin" appFormatoMiles formControlName="precioVentaMin" class="validate"
              [class.error]="precioVentaMin?.invalid && precioVentaMin?.touched">
            <label for="precioVentaMin">Precio Venta Mínimo</label>
            <div *ngIf="precioVentaMin?.invalid && precioVentaMin?.touched" class="error-message">
              <small *ngIf="precioVentaMin?.errors?.['required']">El precio mínimo es requerido</small>
            </div>
          </div>

          <!-- Cantidad -->
          <div class="input">
            <input type="number" id="cantidad" formControlName="cantidad" class="validate"
              [class.error]="cantidad?.invalid && cantidad?.touched">
            <label for="cantidad">Cantidad</label>
            <div *ngIf="cantidad?.invalid && cantidad?.touched" class="error-message">
              <small *ngIf="cantidad?.errors?.['required']">La cantidad es requerida</small>
            </div>
          </div>
        </div>

        <div class="button-container">
          <a routerLink="/parametros/zapato/crear-zapato" class="btn-cancel">
            Cancelar
          </a>
          <button type="submit" class="btn-confirm" [disabled]="fgValidador.invalid">
            Actualizar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
