<div class="login-wrapper">
  <div class="login-card">
    
    <div class="login-header">
      <div class="login-icon-container">
        <svg xmlns="http://www.w3.org/2000/svg" height="42" viewBox="0 -960 960 960" width="42" fill="currentColor">
          <path d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5t126 46.5q29 15 46.5 43.5T800-272v112H160Z" />
        </svg>
      </div>
      <h4 class="login-title">Iniciar Sesión</h4>
      <p class="login-subtitle">Ingresa tus credenciales para acceder</p>
    </div>

    <form [formGroup]="fGroup" class="payment-form">
      
      <div class="input">
        <label for="email">Usuario (Correo)</label>
        <input formControlName="usuario" id="email" type="email" class="validate" 
               placeholder="ejemplo@correo.com"
               [class.error]="obtenerFormGroup['usuario'].invalid && obtenerFormGroup['usuario'].touched">
        <div class="error-message" *ngIf="obtenerFormGroup['usuario'].invalid && (obtenerFormGroup['usuario'].dirty || obtenerFormGroup['usuario'].touched)">
          <small>* Este campo es obligatorio y debe ser un correo.</small>
        </div>
      </div>

      <div class="input">
        <label for="password">Contraseña</label>
        <div style="position: relative;">
          <input formControlName="clave" id="password" [type]="mostrarClave ? 'text' : 'password'" 
                 class="validate" placeholder="••••••••"
                 [class.error]="obtenerFormGroup['clave'].invalid && obtenerFormGroup['clave'].touched" 
                 style="padding-right: 40px; margin-bottom: 0;">
          
          <button type="button" (click)="toggleClave()" 
                  style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #6b7280; padding: 0; display: flex; align-items: center; justify-content: center;">
            <!-- Icono Ojo Cerrado -->
            <svg *ngIf="!mostrarClave" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor">
              <path d="M480-320q75 0 127.5-52.5T660-500q0-75-52.5-127.5T480-680q-75 0-127.5 52.5T300-500q0 75 52.5 127.5T480-320Zm0-72q-45 0-76.5-31.5T372-500q0-45 31.5-76.5T480-608q45 0 76.5 31.5T588-500q0 45-31.5 76.5T480-392Zm0 192q-146 0-266-81.5T40-500q54-137 174-218.5T480-800q146 0 266 81.5T920-500q-54 137-174 218.5T480-200Zm0-300Zm0 220q113 0 207.5-59.5T832-500q-50-101-144.5-160.5T480-720q-113 0-207.5 59.5T88-500q50 101 144.5 160.5T480-280Z"/>
            </svg>
            <!-- Icono Ojo Abierto -->
            <svg *ngIf="mostrarClave" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor">
              <path d="m644-428-58-58q9-47-27-88t-93-32l-58-58q17-8 34.5-12t37.5-4q75 0 127.5 52.5T660-500q0 20-4 37.5T644-428Zm128 126-58-56q38-29 67.5-63.5T832-500q-50-101-144.5-160.5T480-720q-29 0-57 4t-55 12l-62-62q41-17 84-25.5t90-8.5q146 0 266 81.5T920-500q-23 59-60.5 109.5T772-302Zm20 246L624-224q-32 11-68 17.5t-76 6.5q-146 0-266-81.5T40-500q22-54 58-103t83-87L56-816l56-56 736 736-56 56ZM222-624q-29 26-53 57t-41 67q50 101 144.5 160.5T480-280q26 0 51-3t49-10l-92-92q-10 3-21 4.5t-23 1.5q-75 0-127.5-52.5T264-559q0-12 1.5-23t4.5-21l-48-48Z"/>
            </svg>
          </button>
        </div>
        <div class="error-message" *ngIf="obtenerFormGroup['clave'].invalid && (obtenerFormGroup['clave'].dirty || obtenerFormGroup['clave'].touched)">
          <small>* La contraseña es obligatoria.</small>
        </div>
      </div>
      
      <div class="forgot-password">
        <a routerLink="/seguridad/recuperar-clave" class="forgot-link">¿Olvidaste tu contraseña?</a>
      </div>

      <div class="submit-container">
        <button (click)="IdentificarUsuario()" [disabled]="fGroup.invalid" class="btn-submit" style="width: 100%;">
          Ingresar
        </button>
      </div>
      
    </form>
  </div>
</div>
