<div class="card-container">
    <div class="title">
      <h5>Gestión de Usuarios</h5>
    </div>
      <form [formGroup]="fGroup" class="col s12">
        <div class="row">
          <div class="input-field col s3">
            <input formControlName="Nombre" id="Nombre" type="text" class="validate" />
            <label for="Nombre">Nombre</label>
          </div>
          <div class="input-field col s3">
            <input formControlName="Apellido" id="Apellido" type="text" class="validate" />
            <label for="Apellido">Apellido</label>
          </div>
          <div class="input-field col s3">
            <input formControlName="Rol" id="Rol" type="text" class="validate" />
            <label for="Rol">Rol</label>
          </div>
        </div>
        <div class="row">
          <div class="input-field col s8">
            <input formControlName="correo" id="email" type="email" class="validate" />
            <label for="email">Correo</label>
          </div>
          <div class="input-field col s4">
            <input formControlName="telefono" id="telefono" type="text" class="validate" />
            <label for="telefono">Teléfono Celular</label>
          </div>
        </div>
        <div class="row">
          <div class="col s12">
            <button
              class="btn waves-effect waves-light"
              type="button"
              (click)="Registrarse()">
                Guardar
            </button>
          </div>
        </div>
      </form>
      <!-- Tabla de Usuarios -->
  <div class="table-container">
    <h5>Lista de Usuarios</h5>
    <table class="striped">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Rol</th>
          <th>Correo</th>
          <th>Teléfono</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let usuario of usuarios">
          <td>{{ usuario.Nombre }}</td>
          <td>{{ usuario.Apellido }}</td>
          <td>{{ usuario.RolId }}</td>
          <td>{{ usuario.Correo }}</td>
          <td>{{ usuario.Telefono }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
