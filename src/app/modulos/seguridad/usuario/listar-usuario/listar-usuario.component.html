<div class="table-container">
      <div class="table-header">
        <h5>Lista de Usuarios</h5>
      </div>
      <div class="search-bar">
        <input type="text" 
               placeholder="Buscar usuario..." 
               [(ngModel)]="searchQuery" 
               (input)="filtrarUsuarios()" 
               class="validate" />
      </div>
      
      <table class="striped">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Rol</th>
            <th>Correo</th>
            <th>Teléfono</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let usuario of usuariosFiltrados | paginate: { itemsPerPage: registrosPorPagina, currentPage: pag, totalItems: totalItems }">
            <td>{{ usuario.Nombre }}</td>
            <td>{{ usuario.Apellido }}</td>
            <td>{{ usuario.rolId !== undefined ? obtenerNombreRol(usuario.rolId) : '' }}</td>
            <td>{{ usuario.Correo }}</td>
            <td>{{ usuario.Telefono }}</td>
          </tr>
        </tbody>
      </table>
      
      <!-- Control de paginación -->
      <pagination-controls
        (pageChange)="pag = $event"
        previousLabel="Anterior"
        nextLabel="Siguiente"
        screenReaderPaginationLabel="Navegación"
        screenReaderPageLabel="Página"
        screenReaderCurrentLabel="Página Actual">
      </pagination-controls>
</div>
