<div id="login-page" class="row small-box">
    <div class="col s12 z-depth-6 card-panel">
      <form [formGroup]="fGroup" class="login-form">
        <div class="row">
          <div class="info-box col s12 mb-4">
            <h2>Cambiar Clave</h2>
            <p>Por favor ingrese los datos para cambiar la clave</p>
          </div>
        </div>
  
        <div class="row">
          <div class="input-field col s12">
            <svg class="prefix" style="vertical-align: middle; margin-right: 8px; margin-top: 10px;" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor"><path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm320-280L160-640v400h640v-400L480-440Zm0-80 320-200H160l320 200ZM160-640v-80 480-400Z"/></svg>
            <input
              formControlName="correo"
              #correo
              (keydown.enter)="focusNext(correo, claveActual)"
              type="email"
              placeholder="Correo"
            />
          </div>
        </div>
  
        <div class="row">
          <div class="input-field col s12">
            <svg class="prefix" style="vertical-align: middle; margin-right: 8px; margin-top: 10px;" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor"><path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm0-80h480v-400H240v400Zm240-120q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80ZM240-160v-400 400Z"/></svg>
            <input
              formControlName="claveActual"
              #claveActual
              (keydown.enter)="focusNext(claveActual, claveNueva)"
              type="password"
              placeholder="Clave Actual"
            />
          </div>
        </div>
  
        <div class="row">
          <div class="input-field col s12">
            <svg class="prefix" style="vertical-align: middle; margin-right: 8px; margin-top: 10px;" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor"><path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm0-80h480v-400H240v400Zm240-120q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80ZM240-160v-400 400Z"/></svg>
            <input
              formControlName="claveNueva"
              #claveNueva
              (keydown.enter)="submitOrFocusNext(claveNueva)"
              type="password"
              placeholder="Clave Nueva"
            />
          </div>
        </div>
  
        <div class="row">
          <div class="input-field col s12">
            <button
              type="button"
              (click)="CambiarClave()"
              class="btn waves-effect waves-light col s12 black-button"
            >
              Cambiar Clave
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
