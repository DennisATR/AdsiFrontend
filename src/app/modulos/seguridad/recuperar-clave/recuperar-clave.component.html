<div id="login-page" class="row">
    <div class="col s12 z-depth-6 card-panel">
      <form [formGroup]="fGroup" class="login-form">
        <div class="row">
        </div>
        <div class="row">
          <div class="input-field col s12">
            <svg class="prefix" style="vertical-align: middle; margin-right: 8px; margin-top: 10px;" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor"><path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm320-280L160-640v400h640v-400L480-440Zm0-80 320-200H160l320 200ZM160-640v-80 480-400Z"/></svg>
            <input formControlName="usuario" class="validate" id="email" type="email">
            <label for="email" data-error="wrong" data-success="right">Usuario</label>
            <div class="show-errors" *ngIf="obtenerFormGroup['usuario'].errors 
            && (obtenerFormGroup['usuario'].dirty || obtenerFormGroup['usuario'].touched)">
            <strong>Este campo es obligatorio y debe tener el formato de correo electrónico</strong>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="input-field col s12">
            <button (click)="RecuperarClave()" class="btn waves-effect waves-light col s12">Recuperar</button>
          </div>
        </div>
      </form>
    </div>
  </div>
